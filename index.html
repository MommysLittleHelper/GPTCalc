<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="Моментальный расчет кубатуры и мест из любого текста.">
<title>Логистический калькулятор</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
<script src="./script.js" defer></script>
</head>
<body>
<div class="container">
    <div class="theme-switch">
        <button id="theme-light" type="button">☀️ Светлая</button>
        <button id="theme-dark" type="button">🌙 Тёмная</button>
        <button id="theme-system" type="button">💻 Системная</button>
    </div>

    <h1>📦 Логистический калькулятор</h1>
    <p class="subtitle">Умный автовыбор и интерактивное управление</p>

    <textarea id="inputText" placeholder="Вставьте строки сюда...&#10;Пример: 6*5*4&#10;Или: 1500 x 500 x 1000"></textarea>
    <button class="calc-btn" id="calcBtn" type="button">Рассчитать объем</button>

    <div class="quick-actions" aria-label="Быстрые действия">
        <div class="quick-actions-title">⚡ Быстрые действия</div>
        <div class="quick-actions-grid">
            <button class="quick-btn" id="pasteBtn" type="button">📋 Вставить</button>
            <button class="quick-btn" id="quickClearBtn" type="button">🗑️ Очистить</button>
            <button class="quick-btn" id="quickCopyBtn" type="button">📄 Отчёт</button>
        </div>
    </div>

    <div class="connection-status" id="connectionStatus" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span><strong id="statusTitle">Проверка соединения…</strong><small id="statusText">Определяем режим работы</small></span>
    </div>

    <div id="resultBox" class="result" style="display:none;">
        <div class="totals-box">
            <p><span>🚚 Общий объем:</span> <span id="totalVolume"><strong>0.0000</strong> м³</span></p>
            <p><span>🔢 Всего мест:</span> <span id="totalPieces" style="font-weight:600;">0 шт.</span></p>
        </div>

        <button class="copy-btn" id="copyBtn" type="button">📋 Скопировать отчет</button>
        <button class="copy-btn clear-btn" id="clearBtn" type="button">🗑️ Очистить всё</button>

        <div id="bulkActions" class="bulk-box" style="display:none;">
            <span>Применить ко всем строкам:</span>
            <div class="badge-group">
                <button class="btn-badge bulk-unit-btn" type="button" data-unit="м">м</button>
                <button class="btn-badge bulk-unit-btn" type="button" data-unit="см">см</button>
                <button class="btn-badge bulk-unit-btn" type="button" data-unit="мм">мм</button>
            </div>
        </div>

        <div class="details-title">🔍 Построчный разбор текста:</div>
        <div id="detailsList"></div>
    </div>

    <div class="developer-credit"><em>Флагманская версия · для личного использования</em></div>
</div>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(function () {});
}
</script>
<noscript><div class="noscript-message">Для работы калькулятора необходимо включить JavaScript.</div></noscript>
</body>
</html>
