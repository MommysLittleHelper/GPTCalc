<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Логистический калькулятор</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<main class="container">
  <div class="theme-switch" aria-label="Тема">
    <button id="theme-light" type="button">☀️ Светлая</button>
    <button id="theme-dark" type="button">🌙 Тёмная</button>
    <button id="theme-system" type="button">💻 Системная</button>
  </div>

  <h1>📦 Логистический калькулятор</h1>
  <p class="subtitle">Автоматическое определение габаритов груза</p>

  <section id="connectionStatus" class="connection-status checking" aria-live="polite">
    <span class="status-dot"></span>
    <div>
      <strong id="statusTitle">Проверка подключения...</strong>
      <small id="statusText">Проверяем готовность приложения</small>
    </div>
  </section>

  <label class="input-label" for="inputText">Текст с данными груза</label>
  <textarea id="inputText" spellcheck="false"
    placeholder="Вставьте строки или скопированный текст сюда...&#10;&#10;Например:&#10;1200x800x600 мм × 4&#10;2 шт. 600x400x300 мм&#10;120x80x60 см"></textarea>

  <div class="button-row">
    <button class="calc-btn" id="calcBtn" type="button">Рассчитать объём</button>
    <button class="adapt-btn" id="adaptBtn" type="button">Адаптировать текст</button>
  </div>

  <p id="adaptInfo" class="adapt-info" hidden></p>

  <section id="resultBox" class="result" hidden>
    <div id="calcStatus" class="calc-status" aria-live="polite"></div>

    <div class="totals-box">
      <p><span>🚚 Общий объём:</span><strong id="totalVolume">0.0000 м³</strong></p>
      <p><span>🔢 Всего мест:</span><span id="totalPieces">0 шт.</span></p>
    </div>

    <button class="copy-btn primary-copy" id="copyBtn" type="button">📋 Скопировать отчёт</button>
    <button class="copy-btn clear-copy" id="clearBtn" type="button">🗑️ Очистить всё</button>

    <div id="bulkActions" class="bulk-box" hidden>
      <span>Применить ко всем строкам:</span>
      <div class="badge-group">
        <button class="btn-badge bulk-unit-btn" data-unit="м" type="button">м</button>
        <button class="btn-badge bulk-unit-btn" data-unit="см" type="button">см</button>
        <button class="btn-badge bulk-unit-btn" data-unit="мм" type="button">мм</button>
      </div>
    </div>

    <div class="details-title">🔍 Построчный разбор текста:</div>
    <div id="detailsList"></div>
  </section>

  <footer>Флагманская версия • автоматическое определение габаритов груза</footer>
</main>
</body>
</html>
